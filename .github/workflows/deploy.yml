name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (npm ci, Hugo download, lychee) only reads. Only the deploy job, which runs
# nothing but actions/deploy-pages, can write to Pages and mint an OIDC token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read      # configure-pages reads the site's base URL
    env:
      HUGO_VERSION: 0.168.0
      # SHA-256 of hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz (hugo_${HUGO_VERSION}_checksums.txt). Update with HUGO_VERSION.
      HUGO_SHA256: 787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53
      NODE_VERSION: 24
      TZ: America/Mexico_City
    steps:
      - name: Checkout (with theme submodule and full history for .Lastmod)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo (extended)
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${HOME}/.local/hugo" hugo
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Show versions
        run: hugo version && node --version && npm --version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Node dependencies
        run: npm ci

      - name: Restore Hugo cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          hugo build --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Save Hugo cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Site checks (lang, hreflang, switcher, contact obfuscation, OG, alt text)
        run: node scripts/check-site.mjs public

      - name: Internal link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8   # v2.9.0 (third-party: pinned to a commit)
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/public" "public/**/*.html"
          fail: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
