name: Quality (PRs)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"   # Mondays: also catches external links that rotted

permissions:
  contents: read

defaults:
  run:
    shell: bash   # adds -eo pipefail, so a failing hugo inside a pipe fails the step

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
      # SHA-256 of hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz (hugo_${HUGO_VERSION}_checksums.txt). Update with HUGO_VERSION.
      HUGO_SHA256: 787f100057328824f38c6ad7c87ff10d6451ae0a7bc39cedaad0dd2bcde17e53
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Hugo (extended)
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${HOME}/.local/hugo" hugo
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - run: npm ci
      - name: Build (production, local baseURL so tools can crawl it)
        run: hugo build --gc --minify --baseURL "http://localhost:8080/" --logLevel warn --printI18nWarnings 2>&1 | tee build.log
      - name: Fail on Hugo warnings (deprecations, missing i18n, etc.)
        run: "! grep -E 'WARN|ERROR' build.log"
      - run: node scripts/check-site.mjs public --base http://localhost:8080/
      - name: Link check (internal; external only on the weekly schedule)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8   # v2.9.0 (third-party: pinned to a commit)
        with:
          args: >-
            --no-progress --root-dir "${{ github.workspace }}/public"
            ${{ github.event_name != 'schedule' && '--offline' || '--max-retries 2 --exclude linkedin.com' }}
            "public/**/*.html"
          fail: true
      # GitHub Pages compresses text responses; http-server only serves pre-gzipped siblings (-g).
      # Without this Lighthouse measures the uncompressed site (about 86 instead of 97 on the home page).
      - name: Pre-compress public/ like GitHub Pages does
        run: >-
          find public -type f
          \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.xml' -o -name '*.json' -o -name '*.txt' -o -name '*.webmanifest' \)
          -exec gzip -9 -k -f {} +
      - name: Serve public/
        run: |
          npx --yes http-server@14.1.1 public -p 8080 -s -g &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          echo "http-server did not start" >&2; exit 1
      # Use the runner's own Chrome. Without this, a warm npm cache restores the npx install of pa11y-ci but not
      # puppeteer's separately downloaded Chrome (~/.cache/puppeteer), and the step dies with "Could not find Chrome".
      - name: Accessibility (axe via pa11y-ci, every URL in both sitemaps)
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npx --yes pa11y-ci@5.0.0 --config .pa11yci.json
      # Reports stay on the runner (lighthouserc.json: upload target "filesystem") and are never uploaded, not even
      # as an artifact: the page is audited with JavaScript on, so each report holds the decoded email address and a
      # full-page screenshot of the contact details.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.json
