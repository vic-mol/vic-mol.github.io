# ---------------------------------------------------------------------
# Site-wide params (language-independent)
# ---------------------------------------------------------------------
[params]
  name = "Victor Molina"
  firstName = "Victor"
  lastName = "Molina"
  author = "Victor Molina"
  copyright = "Victor Molina"
  profile_image = "images/profile/victor-molina-portrait.jpg"   # assets/ path, processed by partials/img.html
  hero_background = "images/backgrounds/hero-golden-gate-sunrise.jpg"
  og_image = "images/backgrounds/hero-golden-gate-sunrise.jpg"   # source for generated 1200x630 OG cards

  # NOT set on purpose: email, calendly_url, formspreeendpoint, pexelsapikey, emergency_contact.
  # The theme prints `params.email` in plain text; contact data lives in [params.contact] instead.

  linkedin_url = "https://www.linkedin.com/in/victormolinaalba/"
  linkedin_text = "linkedin.com/in/victormolinaalba"
  github_url = "https://github.com/vic-mol"
  github_text = "github.com/vic-mol"

  [params.contact]
    # Reversed string, then Base64 — decoded by assets/js/site.js. Never commit the plain values.
    email_rb64 = "bW9jLmxpYW1ub3RvcnBAYWJsYS5hbmlsb20ucm90Y2l2"      # email
    phone_tel_rb64 = "ODg4NjA5MTI1NTI1Kw=="                            # tel: E.164
    phone_display_rb64 = "ODg4NiAwOTEyIDU1IDI1Kw=="                    # display format
    linkedin_qr_svg = "images/qr/linkedin-qr.svg"                      # assets/ path
    linkedin_qr_png = "images/qr/linkedin-qr.png"

  [[params.social]]
    icon = "linkedin-in"
    url = "https://www.linkedin.com/in/victormolinaalba/"
    label = "LinkedIn"
  [[params.social]]
    icon = "github"
    url = "https://github.com/vic-mol"
    label = "GitHub"

  # One palette only = fixed brand colors (theme JS randomizer is removed in baseof.html).
  [params.color_palettes]
    [[params.color_palettes.palette]]
      name = "bay-first-light"
      main_color = "#22405F"     # Bay Navy
      second_color = "#B5382C"   # Bridge Orange
      third_color = "#8A5640"    # Palace Terracotta

  # Required by the theme's pexels-config partial until baseof.html stops including it.
  [params.pexels]
    queries = ["unused"]
